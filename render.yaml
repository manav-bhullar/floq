services:
  - type: web
    name: floq-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma db push --skip-generate
    startCommand: npm run start
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: floq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: floq-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
  - type: keyvalue
    name: floq-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []
databases:
  - name: floq-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: floq
    user: floq
    ipAllowList: []
