name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run unit tests
        working-directory: server
        run: node scripts/run-tests.js --unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: floq
          POSTGRES_PASSWORD: floq_test
          POSTGRES_DB: floq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U floq"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Setup database
        working-directory: server
        env:
          DATABASE_URL: postgresql://floq:floq_test@localhost:5432/floq_test
        run: npx prisma db push --skip-generate && npx prisma generate

      - name: Run integration tests
        working-directory: server
        env:
          DATABASE_URL: postgresql://floq:floq_test@localhost:5432/floq_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret
          JWT_REFRESH_SECRET: ci_test_refresh_secret
          NODE_ENV: test
          PORT: 5050
        run: node scripts/run-tests.js
